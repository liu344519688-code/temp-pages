<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
  <title>发票信息</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;background:#fff;color:#111;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif}body{min-height:100vh}
    .page{min-height:100vh;position:relative;padding:0 18px 34px;overflow:hidden;background:#fff}
    .top{height:92px;position:relative;width:100%;margin:0 auto}
    .home{position:absolute;left:0;top:22px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;text-decoration:none;color:#000}.home svg{width:24px;height:24px;fill:#000}
    .cap{position:absolute;right:0;top:17px;width:96px;height:42px;border:1px solid #ececec;border-radius:21px;background:#fff;display:flex}
    .cl,.cr{width:48px;height:100%;display:flex;align-items:center;justify-content:center}.cl{border-right:1px solid #efefef;gap:4px}.dot{width:5.5px;height:5.5px;border-radius:50%;background:#222}
    .target{width:22px;height:22px;border:2.8px solid #222;border-radius:50%;position:relative}.target:after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;border-radius:50%;background:#222;transform:translate(-50%,-50%)}
    .content{max-width:345px;margin:0 auto;padding-top:22px;text-align:center}.title{font-size:22px;line-height:1.2;margin:0 0 21px;font-weight:700}
    .notice{font-size:17px;line-height:1.55;margin:0 auto 49px;max-width:345px;color:#222}
    .info{width:100%;max-width:345px;margin:0 auto;text-align:left}.row{display:grid;grid-template-columns:108px 1fr;align-items:baseline;margin:15px 0;font-size:15px;line-height:1.42}.label{color:#8b8b8b}.value{color:#171717;word-break:break-all}.amount{font-weight:500}
    .foot{position:fixed;left:50%;transform:translateX(-50%);bottom:52px;width:calc(100% - 36px);max-width:345px;text-align:center;color:#b8b8b8;font-size:15px;line-height:1.58}
  </style>
</head>
<body>
  <section class="page">
    <div class="top">
      <a class="home" href="../../" aria-label="返回首页"><svg viewBox="0 0 64 64"><path d="M7.8 29.8 29.5 8.9a3.7 3.7 0 0 1 5 0l21.7 20.9a3.5 3.5 0 0 1-2.4 6H50v19.1a3.1 3.1 0 0 1-3.1 3.1H37V43.8H27V58h-9.9a3.1 3.1 0 0 1-3.1-3.1V35.8h-3.8a3.5 3.5 0 0 1-2.4-6Z"/></svg></a>
      <div class="cap"><div class="cl"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div><div class="cr"><span class="target"></span></div></div>
    </div>
    <div class="content">
      <h1 class="title">发票信息</h1>
      <div class="notice">以下信息仅为发票二维码所含信息，并不<br>代表查验发票真伪的结果。</div>
      <div class="info">
        <div class="row"><div class="label">发票号码</div><div class="value">26432000002045052271</div></div>
        <div class="row"><div class="label">合计金额</div><div class="value amount">¥1899579.40(含税)</div></div>
        <div class="row"><div class="label">开票日期</div><div class="value">2026.09.01</div></div>
      </div>
    </div>
    <div class="foot">如需查验发票真伪，请通过税务机关提供的官方渠道进行查验。</div>
  </section>
</body>
</html>
