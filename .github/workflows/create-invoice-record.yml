name: Create Invoice QR Record

on:
  workflow_dispatch:
    inputs:
      invoice_no:
        description: 发票号码
        required: true
        type: string
      amount:
        description: 合计金额（只填数字，例如 240042.60）
        required: true
        type: string
      invoice_date:
        description: 开票日期（例如 2026.08.05）
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: create-invoice-record
  cancel-in-progress: false

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare Python
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --upgrade pip
          python -m pip install 'qrcode[pil]'

      - name: Create permanent record page and QR
        env:
          INVOICE_NO: ${{ inputs.invoice_no }}
          AMOUNT: ${{ inputs.amount }}
          INVOICE_DATE: ${{ inputs.invoice_date }}
        run: |
          python - <<'PY'
          import json, os, re, html
          from pathlib import Path
          from datetime import datetime, timezone
          import qrcode
          from PIL import Image, ImageDraw, ImageFont

          root = Path('.')
          records_path = root / 'data' / 'records.json'
          records_path.parent.mkdir(parents=True, exist_ok=True)
          if records_path.exists():
              records = json.loads(records_path.read_text(encoding='utf-8'))
          else:
              records = []

          nums = []
          for r in records:
              m = re.fullmatch(r'A(\d+)', str(r.get('id','')).upper())
              if m:
                  nums.append(int(m.group(1)))
          n = (max(nums) + 1) if nums else 1
          record_id = f'A{n:03d}'
          slug = record_id.lower()

          invoice_no = os.environ['INVOICE_NO'].strip()
          amount_raw = os.environ['AMOUNT'].strip().replace('¥','').replace(',','')
          invoice_date = os.environ['INVOICE_DATE'].strip()
          try:
              amount_display = f'¥{float(amount_raw):.2f}(含税)'
          except Exception:
              amount_display = f'¥{amount_raw}(含税)'

          page_dir = root / 'q' / slug
          page_dir.mkdir(parents=True, exist_ok=True)

          page_url = f'https://liu344519688-code.github.io/temp-pages/q/{slug}/'
          page_html = f'''<!DOCTYPE html>
          <html lang="zh-CN">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
            <title>发票信息</title>
            <style>
              *{{box-sizing:border-box}}html,body{{margin:0;background:#fff;color:#111;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif}}body{{min-height:100vh}}
              .page{{min-height:100vh;position:relative;padding:0 18px 34px;overflow:hidden;background:#fff}}
              .top{{height:92px;position:relative;width:100%;margin:0 auto}}
              .home{{position:absolute;left:0;top:22px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;text-decoration:none;color:#000}}.home svg{{width:24px;height:24px;fill:#000}}
              .cap{{position:absolute;right:0;top:17px;width:96px;height:42px;border:1px solid #ececec;border-radius:21px;background:#fff;display:flex}}
              .cl,.cr{{width:48px;height:100%;display:flex;align-items:center;justify-content:center}}.cl{{border-right:1px solid #efefef;gap:4px}}.dot{{width:5.5px;height:5.5px;border-radius:50%;background:#222}}
              .target{{width:22px;height:22px;border:2.8px solid #222;border-radius:50%;position:relative}}.target:after{{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;border-radius:50%;background:#222;transform:translate(-50%,-50%)}}
              .content{{max-width:345px;margin:0 auto;padding-top:22px;text-align:center}}.title{{font-size:22px;line-height:1.2;margin:0 0 21px;font-weight:700}}
              .notice{{font-size:17px;line-height:1.55;margin:0 auto 49px;max-width:345px;color:#222}}
              .info{{width:100%;max-width:345px;margin:0 auto;text-align:left}}.row{{display:grid;grid-template-columns:108px 1fr;align-items:baseline;margin:15px 0;font-size:15px;line-height:1.42}}.label{{color:#8b8b8b}}.value{{color:#171717;word-break:break-all}}.amount{{font-weight:500}}
              .foot{{position:fixed;left:50%;transform:translateX(-50%);bottom:52px;width:calc(100% - 36px);max-width:345px;text-align:center;color:#b8b8b8;font-size:15px;line-height:1.58}}
            </style>
          </head>
          <body>
            <section class="page">
              <div class="top">
                <a class="home" href="../../" aria-label="返回首页"><svg viewBox="0 0 64 64"><path d="M7.8 29.8 29.5 8.9a3.7 3.7 0 0 1 5 0l21.7 20.9a3.5 3.5 0 0 1-2.4 6H50v19.1a3.1 3.1 0 0 1-3.1 3.1H37V43.8H27V58h-9.9a3.1 3.1 0 0 1-3.1-3.1V35.8h-3.8a3.5 3.5 0 0 1-2.4-6Z"/></svg></a>
                <div class="cap"><div class="cl"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div><div class="cr"><span class="target"></span></div></div>
              </div>
              <div class="content">
                <h1 class="title">发票信息</h1>
                <div class="notice">以下信息仅为发票二维码所含信息，并不<br>代表查验发票真伪的结果。</div>
                <div class="info">
                  <div class="row"><div class="label">发票号码</div><div class="value">{html.escape(invoice_no)}</div></div>
                  <div class="row"><div class="label">合计金额</div><div class="value amount">{html.escape(amount_display)}</div></div>
                  <div class="row"><div class="label">开票日期</div><div class="value">{html.escape(invoice_date)}</div></div>
                </div>
              </div>
              <div class="foot">如需查验发票真伪，请通过税务机关提供的官方渠道进行查验。</div>
            </section>
          </body>
          </html>'''
          (page_dir / 'index.html').write_text(page_html, encoding='utf-8')

          qr = qrcode.QRCode(error_correction=qrcode.constants.ERROR_CORRECT_Q, box_size=9, border=0)
          qr.add_data(page_url)
          qr.make(fit=True)
          img = qr.make_image(fill_color='black', back_color='white').convert('RGB')
          img = img.resize((300,300), Image.Resampling.NEAREST)
          draw = ImageDraw.Draw(img)
          cx = cy = 150
          patch = 42
          draw.rectangle([cx-patch//2, cy-patch//2, cx+patch//2, cy+patch//2], fill='white')
          font_path = '/usr/share/fonts/opentype/noto/NotoSerifCJK-Regular.ttc'
          font = ImageFont.truetype(font_path, 38)
          text='税'
          bbox=draw.textbbox((0,0),text,font=font)
          tw,th=bbox[2]-bbox[0],bbox[3]-bbox[1]
          draw.text((cx-tw/2,cy-th/2-2),text,font=font,fill=(242,210,92))
          img.save(page_dir / 'qrcode.png')

          records.append({
              'id': record_id,
              'invoiceNo': invoice_no,
              'amount': amount_raw,
              'date': invoice_date,
              'path': f'q/{slug}/',
              'createdAt': datetime.now(timezone.utc).date().isoformat()
          })
          records_path.write_text(json.dumps(records, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          print(f'RECORD_ID={record_id}')
          print(f'PAGE_URL={page_url}')
          PY

      - name: Commit generated record
        run: |
          git config user.name "invoice-record-bot"
          git config user.email "invoice-record-bot@users.noreply.github.com"
          git add data/records.json q/
          git commit -m "Add invoice QR record" || exit 0
          git pull --rebase origin main
          git push origin main
