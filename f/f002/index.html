<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>照片</title>

<style>
*{
  box-sizing:border-box
}

html,body{
  margin:0;
  background:#f5f6f8;
  color:#111;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "PingFang SC",
    "Microsoft YaHei",
    Arial,
    sans-serif
}

.wrap{
  max-width:1100px;
  margin:auto;
  padding:18px
}

.bar{
  background:#fff;
  border:1px solid #e8e8e8;
  border-radius:16px;
  padding:16px 18px;
  margin-bottom:14px;
  display:flex;
  justify-content:space-between;
  gap:12px;
  align-items:center
}

.title{
  font-size:20px;
  font-weight:800
}

.meta{
  color:#888;
  font-size:13px;
  margin-top:5px
}

.download{
  background:#111;
  color:#fff;
  text-decoration:none;
  border-radius:10px;
  padding:10px 14px;
  font-weight:700;
  white-space:nowrap
}

.viewer{
  background:#fff;
  border:1px solid #e8e8e8;
  border-radius:16px;
  overflow:hidden;
  min-height:70vh;
  display:flex;
  align-items:center;
  justify-content:center
}

.image{
  display:block;
  max-width:100%;
  height:auto;
  margin:auto
}

.pdf{
  width:100%;
  height:82vh;
  border:0;
  background:#fff
}

@media(max-width:640px){
  .wrap{
    padding:10px
  }

  .bar{
    align-items:flex-start
  }

  .title{
    font-size:18px
  }

  .pdf{
    height:78vh
  }
}
</style>
</head>

<body>
<div class="wrap">

  <div class="bar">
    <div>
      <div class="title">
        照片
      </div>

      <div class="meta">
        微信图片_20260929105538_151_4.jpg
      </div>
    </div>

    <a
      class="download"
      href="./file.jpg"
      download>
      下载原文件
    </a>
  </div>

  <div class="viewer">
    <img
           class="image"
           src="./file.jpg"
           alt="照片">
  </div>

</div>
</body>
</html>
