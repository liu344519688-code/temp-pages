<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>发票二维码管理</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#111;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif}.wrap{max-width:1040px;margin:auto;padding:24px 16px 50px}.card{background:#fff;border:1px solid #e8e8e8;border-radius:18px;padding:22px;box-shadow:0 8px 28px rgba(0,0,0,.05);margin-bottom:18px}.head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.head h1{margin:0;font-size:28px}.sub{margin-top:8px;color:#6f6f6f;line-height:1.65}.badge{border:0;background:#111;color:#fff;border-radius:999px;padding:9px 14px;font-weight:700;white-space:nowrap;cursor:pointer}.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:20px}.field label{display:block;font-weight:700;margin-bottom:7px}.field input{width:100%;height:46px;border:1px solid #d4d4d4;border-radius:10px;padding:0 12px;font-size:16px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.btn{height:44px;border:0;border-radius:10px;padding:0 18px;font-size:15px;font-weight:700;cursor:pointer}.primary{background:#111;color:#fff}.secondary{background:#eef0f2}.outline{background:#fff;border:1px solid #d8d8d8}.btn:disabled{opacity:.45;cursor:not-allowed}.status{margin-top:14px;padding:12px 14px;border-radius:10px;background:#f7f7f7;color:#555;display:none;line-height:1.55}.status.ok{background:#eef8f0;color:#216b31}.status.err{background:#fff0f0;color:#a62626}.preview{display:none;margin-top:18px;border-top:1px solid #eee;padding-top:18px}.url{font-size:13px;word-break:break-all;background:#f7f8fa;padding:10px;border-radius:8px;border:1px solid #e7e7e7}.qr{text-align:center;margin-top:16px}.qr canvas{width:300px;height:300px;max-width:100%}.historyTop{display:flex;justify-content:space-between;align-items:center}.historyTop h2{margin:0}.tableWrap{overflow:auto;margin-top:14px}table{border-collapse:collapse;width:100%;min-width:940px}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid #eee;font-size:14px;vertical-align:middle}th{color:#777;background:#fafafa}.small{height:34px;padding:0 11px;border-radius:8px;border:0;font-weight:700;cursor:pointer}.open{background:#111;color:#fff;text-decoration:none;display:inline-flex;align-items:center}.copy{background:#eef0f2}.download{background:#eef0f2;color:#111;text-decoration:none;display:inline-flex;align-items:center}.ops{display:flex;gap:7px;flex-wrap:wrap}.empty{text-align:center;color:#999;padding:28px}.resultBox{display:none;margin-top:14px;padding:14px;border-radius:12px;background:#eef8f0}.resultBox a{word-break:break-all;color:#135d24}.hint{color:#888;font-size:13px;line-height:1.6;margin-top:10px}.qrThumb{width:84px;height:84px;object-fit:contain;background:#fff;border:1px solid #ececec;border-radius:8px;display:block}.qrMissing{width:84px;height:84px;border:1px dashed #d8d8d8;border-radius:8px;color:#aaa;display:flex;align-items:center;justify-content:center;font-size:12px;text-align:center}.qrModal{position:fixed;inset:0;background:rgba(0,0,0,.58);display:none;align-items:center;justify-content:center;padding:18px;z-index:9999}.qrModal.show{display:flex}.qrModalBox{background:#fff;border-radius:16px;padding:18px;max-width:360px;width:100%;text-align:center;box-shadow:0 18px 70px rgba(0,0,0,.28)}.qrModalBox img{width:300px;height:300px;max-width:100%;object-fit:contain;display:block;margin:0 auto}.qrModalTitle{font-size:18px;font-weight:800;margin-bottom:12px}.qrModalActions{display:flex;gap:10px;margin-top:14px}.qrModalActions a,.qrModalActions button{flex:1;height:42px;border-radius:9px;border:0;font-weight:700;display:flex;align-items:center;justify-content:center;text-decoration:none;cursor:pointer}.qrModalActions a{background:#111;color:#fff}.qrModalActions button{background:#eef0f2;color:#111}@media(max-width:720px){.wrap{padding:12px}.card{padding:17px}.head{display:block}.badge{margin-top:12px}.grid{grid-template-columns:1fr}.actions{display:grid;grid-template-columns:1fr}.btn{width:100%}}
</style>
</head>
<body>
<div class="wrap">
  <section class="card">
    <div class="head">
      <div><h1>发票二维码管理</h1><div class="sub">正式二维码使用 A001、A002、A003… 独立短编号。生成后不会覆盖旧记录。</div></div>
      <button class="badge" id="nextBadge" type="button">下一编号 A002</button>
    </div>
    <div class="grid">
      <div class="field"><label>发票号码</label><input id="invoiceNo" inputmode="numeric" placeholder="例如：26432000001833663121"></div>
      <div class="field"><label>合计金额（含税）</label><input id="amount" inputmode="decimal" placeholder="例如：240042.60"></div>
      <div class="field"><label>开票日期</label><input id="date" placeholder="例如：2026.08.05"></div>
    </div>
    <div class="actions">
      <button class="btn primary" id="saveBtn">正式生成二维码</button>
      <button class="btn secondary" id="previewBtn">预览新版二维码</button>
      <button class="btn outline" id="clearBtn">清空</button>
    </div>
    <div class="hint" id="backendHint">正在检查正式生成后台…</div>
    <div class="status" id="status"></div>
    <div class="resultBox" id="resultBox"></div>
    <div class="preview" id="preview"><div class="url" id="previewUrl"></div><div class="qr"><div id="qrcode"></div></div></div>
  </section>

  <section class="card">
    <div class="historyTop"><h2>历史记录</h2><div id="recordCount">加载中…</div></div>
    <div class="tableWrap"><table><thead><tr><th>编号</th><th>二维码</th><th>发票号码</th><th>金额</th><th>开票日期</th><th>创建日期</th><th>操作</th></tr></thead><tbody id="recordsBody"><tr><td colspan="7" class="empty">正在读取…</td></tr></tbody></table></div>
  </section>
</div>

<div class="qrModal" id="qrModal" aria-hidden="true">
  <div class="qrModalBox">
    <div class="qrModalTitle" id="qrModalTitle">二维码</div>
    <img id="qrModalImg" alt="二维码">
    <div class="qrModalActions">
      <a id="qrModalDownload" href="#" download>下载 PNG</a>
      <button id="qrModalClose" type="button">关闭</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script>
const $=id=>document.getElementById(id);
let records=[];
let workerApi='';
const PAGE_BASE='https://liu344519688-code.github.io/temp-pages/';
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function nextId(){let m=0;for(const r of records){const n=parseInt(String(r.id||'').replace(/\D/g,''),10);if(Number.isFinite(n))m=Math.max(m,n)}return 'A'+String(m+1).padStart(3,'0')}
function slug(id){return id.toLowerCase()}
function formData(){const invoiceNo=$('invoiceNo').value.trim();const amount=$('amount').value.trim().replace(/,/g,'');const date=$('date').value.trim();if(!invoiceNo||!amount||!date){showStatus('请填写发票号码、金额和开票日期。','err');return null}return{invoiceNo,amount,date}}
function showStatus(text,type=''){const el=$('status');el.textContent=text;el.className='status '+type;el.style.display='block'}
async function loadConfig(){try{const r=await fetch('./data/app-config.json?ts='+Date.now(),{cache:'no-store'});const c=await r.json();workerApi=String(c.workerApiBase||'').replace(/\/$/,'');if(workerApi){$('backendHint').textContent='正式生成后台：已连接';$('saveBtn').disabled=false}else{$('backendHint').textContent='正式生成后台尚未连接 Cloudflare Worker。';$('saveBtn').disabled=true}}catch(e){$('backendHint').textContent='后台配置读取失败';$('saveBtn').disabled=true}}
async function loadRecords(){try{const r=await fetch('./data/records.json?ts='+Date.now(),{cache:'no-store'});records=await r.json();$('recordCount').textContent='共 '+records.length+' 条';$('nextBadge').textContent='下一编号 '+nextId();renderRecords()}catch(e){$('recordCount').textContent='读取失败';$('recordsBody').innerHTML='<tr><td colspan="7" class="empty">历史记录暂时无法读取</td></tr>'}}
function renderRecords(){const body=$('recordsBody');body.innerHTML='';if(!records.length){body.innerHTML='<tr><td colspan="7" class="empty">暂无记录</td></tr>';return}for(const r of records.slice().reverse()){const page=new URL(r.path,PAGE_BASE).href;const qr=r.qr?new URL(r.qr,PAGE_BASE).href:'';const tr=document.createElement('tr');const qrCell=qr?'<button class="qrShow" data-id="'+esc(r.id)+'" data-qr="'+qr+'" style="border:0;background:none;padding:0;cursor:pointer"><img class="qrThumb" src="'+qr+'?ts='+Date.now()+'" alt="'+esc(r.id)+' 二维码"></button>':'<div class="qrMissing">暂无<br>二维码文件</div>';const qrOps=qr?'<button class="small copy qr-view" data-id="'+esc(r.id)+'" data-qr="'+qr+'">查看二维码</button><a class="small download" href="'+qr+'" download="'+esc(r.id)+'-qrcode.png">下载二维码</a>':'';tr.innerHTML='<td><b>'+esc(r.id)+'</b></td><td>'+qrCell+'</td><td>'+esc(r.invoiceNo)+'</td><td>¥'+esc(r.amount)+'</td><td>'+esc(r.date)+'</td><td>'+esc(r.createdAt||'')+'</td><td><div class="ops"><a class="small open" href="'+page+'" target="_blank">打开页面</a><button class="small copy copy-link" data-url="'+page+'">复制链接</button>'+qrOps+'</div></td>';body.appendChild(tr)}document.querySelectorAll('.copy-link').forEach(b=>b.onclick=()=>copyText(b.dataset.url));document.querySelectorAll('.qr-view,.qrShow').forEach(b=>b.onclick=()=>openQr(b.dataset.id,b.dataset.qr))}
function openQr(id,url){$('qrModalTitle').textContent=id+' 二维码';$('qrModalImg').src=url+'?ts='+Date.now();$('qrModalDownload').href=url;$('qrModalDownload').setAttribute('download',id+'-qrcode.png');$('qrModal').classList.add('show');$('qrModal').setAttribute('aria-hidden','false')}
function closeQr(){$('qrModal').classList.remove('show');$('qrModal').setAttribute('aria-hidden','true')}
async function copyText(t){try{await navigator.clipboard.writeText(t);showStatus('链接已复制。','ok')}catch(e){prompt('请复制链接：',t)}}
function decorateQR(){const wrap=$('qrcode');const src=wrap.querySelector('canvas');if(!src)return;const out=document.createElement('canvas');out.width=300;out.height=300;const c=out.getContext('2d');c.imageSmoothingEnabled=false;c.fillStyle='#fff';c.fillRect(0,0,300,300);c.drawImage(src,0,0,300,300);const box=45;c.fillStyle='#fff';c.fillRect((300-box)/2,(300-box)/2,box,box);c.fillStyle='#F2D25C';c.textAlign='center';c.textBaseline='middle';c.font='38px "Songti SC","STSong","SimSun",serif';c.fillText('税',150,151);wrap.innerHTML='';wrap.appendChild(out)}
function preview(){const d=formData();if(!d)return;const id=nextId();const u=PAGE_BASE+'q/'+slug(id)+'/';$('previewUrl').textContent=u;$('qrcode').innerHTML='';new QRCode($('qrcode'),{text:u,width:300,height:300,colorDark:'#000',colorLight:'#fff',correctLevel:QRCode.CorrectLevel.M});requestAnimationFrame(()=>requestAnimationFrame(decorateQR));$('preview').style.display='block';showStatus('这是下一编号 '+id+' 的新版短链接二维码预览。','ok')}
async function createOfficial(){const d=formData();if(!d)return;if(!workerApi){showStatus('正式后台尚未部署，暂时不能写入正式记录。','err');return}const expected=nextId();$('saveBtn').disabled=true;showStatus('正在提交 '+expected+' 正式生成任务，请稍候…');$('resultBox').style.display='none';try{const r=await fetch(workerApi+'/create',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});const j=await r.json().catch(()=>({}));if(!r.ok||!j.ok)throw new Error(j.error||'提交失败');showStatus('任务已提交。正在等待 GitHub 自动生成 '+expected+'…','ok');await waitForRecord(expected,d)}catch(e){showStatus('正式生成失败：'+e.message,'err');$('saveBtn').disabled=false}}
async function waitForRecord(expected,d){for(let i=0;i<30;i++){await new Promise(r=>setTimeout(r,4000));await loadRecords();const hit=records.find(x=>x.id===expected&&String(x.invoiceNo)===d.invoiceNo);if(hit){const page=new URL(hit.path,PAGE_BASE).href;const qr=hit.qr?new URL(hit.qr,PAGE_BASE).href:page+'qrcode.png';$('resultBox').innerHTML='<b>'+esc(expected)+' 生成成功</b><br>页面：<a href="'+page+'" target="_blank">'+page+'</a><br>二维码：<a href="'+qr+'" target="_blank">查看 PNG</a>';$('resultBox').style.display='block';showStatus(expected+' 已正式保存并加入历史记录。','ok');$('saveBtn').disabled=false;return}}showStatus('任务已提交，但两分钟内尚未检测到新记录。可稍后刷新页面查看历史记录。','err');$('saveBtn').disabled=false}
$('previewBtn').onclick=preview;$('saveBtn').onclick=createOfficial;$('clearBtn').onclick=()=>{$('invoiceNo').value='';$('amount').value='';$('date').value='';$('preview').style.display='none';$('status').style.display='none';$('resultBox').style.display='none'};$('nextBadge').onclick=()=>{$('invoiceNo').focus();showStatus('当前下一正式编号为 '+nextId()+'，填写三项后点击“正式生成二维码”。')};$('qrModalClose').onclick=closeQr;$('qrModal').onclick=e=>{if(e.target===$('qrModal'))closeQr()};
loadConfig();loadRecords();
</script>
</body>
</html>
