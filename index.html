<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>信息分享页</title>
  <meta name="description" content="生成可分享的文字信息链接和二维码。" />
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",Arial,sans-serif;background:linear-gradient(135deg,#f3f8ff,#effaf2);color:#172033;padding:24px}.wrap{max-width:760px;margin:0 auto}.card{background:#fff;border-radius:22px;padding:30px;box-shadow:0 18px 50px rgba(15,23,42,.10);border:1px solid #e7edf3}.brand{text-align:center;margin-bottom:24px}.brand h1{margin:0 0 8px;font-size:30px}.brand p{margin:0;color:#64748b;line-height:1.7}.field{margin-top:18px}.field label{display:block;font-weight:700;margin-bottom:8px}.field input,.field textarea{width:100%;border:1px solid #cbd5e1;border-radius:12px;padding:12px 14px;font-size:16px;font-family:inherit;outline:none}.field input{height:48px}.field textarea{min-height:180px;resize:vertical;line-height:1.75}.field input:focus,.field textarea:focus{border-color:#16a34a;box-shadow:0 0 0 4px rgba(22,163,74,.10)}.btns{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.btn{border:0;border-radius:12px;height:48px;font-size:16px;font-weight:700;cursor:pointer}.primary{background:#16a34a;color:#fff}.dark{background:#0f172a;color:#fff}.light{background:#e2e8f0;color:#334155}.result{display:none;margin-top:28px;padding-top:24px;border-top:1px solid #e2e8f0}.result h2{font-size:20px;margin:0 0 12px}.share-url{word-break:break-all;background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:12px;line-height:1.6;font-size:14px}.qr{text-align:center;margin-top:20px}.qr #qrcode{display:inline-flex;padding:14px;background:#fff;border:1px solid #e2e8f0;border-radius:16px}.qr img,.qr canvas{display:block}.info-view{display:none}.info-head{border-bottom:1px solid #e2e8f0;padding-bottom:18px;margin-bottom:20px}.info-title{font-size:30px;font-weight:800;margin:0 0 10px;line-height:1.35}.info-sub{color:#64748b;font-size:14px}.info-content{font-size:17px;line-height:1.9;white-space:pre-wrap;word-break:break-word}.back{display:inline-block;margin-top:28px;color:#15803d;text-decoration:none;font-weight:700}.footer{text-align:center;margin-top:22px;color:#94a3b8;font-size:13px}@media(max-width:560px){body{padding:14px}.card{padding:22px 17px;border-radius:18px}.btns{grid-template-columns:1fr}.brand h1,.info-title{font-size:25px}}
  </style>
</head>
<body>
<div class="wrap">
  <section class="card" id="editorView">
    <div class="brand">
      <h1>文字信息链接生成器</h1>
      <p>输入标题和文字内容，自动生成一个可分享的网址和二维码。别人打开链接或扫码后，就能直接看到您填写的信息。</p>
    </div>

    <div class="field">
      <label for="titleInput">标题</label>
      <input id="titleInput" maxlength="120" placeholder="例如：湖南省天亮农业技术开发有限公司" />
    </div>

    <div class="field">
      <label for="contentInput">文字信息</label>
      <textarea id="contentInput" maxlength="5000" placeholder="例如：公司介绍、项目说明、联系人、电话、地址、产品信息等……"></textarea>
    </div>

    <div class="btns">
      <button class="btn primary" id="generateBtn">生成信息链接 + 二维码</button>
      <button class="btn light" id="clearBtn">清空</button>
    </div>

    <div class="result" id="result">
      <h2>分享链接</h2>
      <div class="share-url" id="shareUrl"></div>
      <div class="btns">
        <button class="btn dark" id="copyBtn">复制链接</button>
        <button class="btn light" id="previewBtn">打开预览</button>
      </div>
      <div class="qr"><div id="qrcode"></div></div>
      <button class="btn dark" id="downloadBtn" style="width:100%;margin-top:14px">下载二维码 PNG</button>
    </div>
  </section>

  <section class="card info-view" id="infoView">
    <div class="info-head">
      <h1 class="info-title" id="infoTitle"></h1>
      <div class="info-sub">信息展示页</div>
    </div>
    <div class="info-content" id="infoContent"></div>
    <a class="back" href="./">← 返回信息生成器</a>
  </section>

  <div class="footer">Powered by GitHub Pages</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script>
  const editorView=document.getElementById('editorView');
  const infoView=document.getElementById('infoView');
  const titleInput=document.getElementById('titleInput');
  const contentInput=document.getElementById('contentInput');
  const result=document.getElementById('result');
  const shareUrl=document.getElementById('shareUrl');
  const qrWrap=document.getElementById('qrcode');

  function buildShareUrl(){
    const title=titleInput.value.trim();
    const content=contentInput.value.trim();
    if(!title && !content){alert('请至少填写标题或文字内容。');return null;}
    const url=new URL(location.href);
    url.search='';
    url.hash='';
    if(title) url.searchParams.set('title',title);
    if(content) url.searchParams.set('text',content);
    url.searchParams.set('view','1');
    return url.toString();
  }

  function generate(){
    const url=buildShareUrl();
    if(!url) return;
    shareUrl.textContent=url;
    qrWrap.innerHTML='';
    new QRCode(qrWrap,{text:url,width:280,height:280,colorDark:'#000000',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});
    result.style.display='block';
    result.scrollIntoView({behavior:'smooth',block:'start'});
  }

  function showInfoPage(){
    const p=new URLSearchParams(location.search);
    if(p.get('view')!=='1') return false;
    const title=p.get('title')||'信息展示';
    const text=p.get('text')||'';
    document.title=title;
    document.getElementById('infoTitle').textContent=title;
    document.getElementById('infoContent').textContent=text;
    editorView.style.display='none';
    infoView.style.display='block';
    return true;
  }

  document.getElementById('generateBtn').addEventListener('click',generate);
  document.getElementById('clearBtn').addEventListener('click',()=>{titleInput.value='';contentInput.value='';result.style.display='none';qrWrap.innerHTML='';titleInput.focus();});
  document.getElementById('copyBtn').addEventListener('click',async()=>{const url=shareUrl.textContent;if(!url)return;try{await navigator.clipboard.writeText(url);alert('链接已复制。');}catch(e){prompt('请复制下面的链接：',url);}});
  document.getElementById('previewBtn').addEventListener('click',()=>{const url=shareUrl.textContent;if(url)window.open(url,'_blank');});
  document.getElementById('downloadBtn').addEventListener('click',()=>{const canvas=qrWrap.querySelector('canvas');const img=qrWrap.querySelector('img');let src=canvas?canvas.toDataURL('image/png'):(img?img.src:'');if(!src){alert('请先生成二维码。');return;}const a=document.createElement('a');a.href=src;a.download='信息二维码.png';document.body.appendChild(a);a.click();a.remove();});

  showInfoPage();
</script>
</body>
</html>
