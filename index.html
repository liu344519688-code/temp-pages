<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>发票信息链接生成器</title>
  <meta name="description" content="生成发票信息展示链接和二维码。" />
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;background:#fff;color:#111;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif}
    body{min-height:100vh}
    .generator{max-width:720px;margin:32px auto;padding:24px}
    .panel{border:1px solid #e5e7eb;border-radius:18px;padding:24px;box-shadow:0 10px 30px rgba(0,0,0,.06)}
    .panel h1{margin:0 0 8px;font-size:28px}.desc{color:#6b7280;line-height:1.7;margin-bottom:24px}
    .field{margin:16px 0}.field label{display:block;font-weight:700;margin-bottom:8px}.field input{width:100%;height:46px;border:1px solid #d1d5db;border-radius:10px;padding:0 12px;font-size:16px;outline:none}.field input:focus{border-color:#111}
    .buttons{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}.btn{height:46px;border:0;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer}.primary{background:#111;color:#fff}.secondary{background:#f3f4f6;color:#111}
    .result{display:none;margin-top:24px;border-top:1px solid #eee;padding-top:20px}.url{font-size:13px;line-height:1.6;word-break:break-all;background:#f8fafc;border:1px solid #e5e7eb;border-radius:10px;padding:12px}.qr{text-align:center;margin-top:18px}.qr>div{display:inline-block;padding:12px;border:1px solid #eee;background:#fff}.qr img,.qr canvas{display:block}

    .invoice-view{display:none;min-height:100vh;background:#fff;position:relative;padding:0 24px 42px;overflow:hidden}

    /* 顶部区域：按参考图还原小程序样式 */
    .mini-topbar{height:112px;position:relative;width:100%;max-width:828px;margin:0 auto}
    .home-btn{position:absolute;left:0;top:29px;width:42px;height:42px;display:flex;align-items:center;justify-content:center;text-decoration:none;color:#000}
    .home-btn svg{width:36px;height:36px;display:block;fill:#000}
    .capsule{position:absolute;right:0;top:21px;width:168px;height:62px;border:1px solid #ececec;border-radius:31px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 .5px rgba(0,0,0,.01)}
    .capsule-left,.capsule-right{height:100%;display:flex;align-items:center;justify-content:center}
    .capsule-left{width:84px;border-right:1px solid #efefef;gap:7px}
    .dot{width:10px;height:10px;border-radius:50%;background:#222;display:block}
    .capsule-right{width:84px}
    .target{width:31px;height:31px;border:4px solid #222;border-radius:50%;position:relative}
    .target::after{content:"";position:absolute;left:50%;top:50%;width:9px;height:9px;border-radius:50%;background:#222;transform:translate(-50%,-50%)}

    .content{max-width:620px;margin:0 auto;padding-top:91px;text-align:center}
    .title{font-size:42px;line-height:1.2;margin:0 0 48px;font-weight:800;letter-spacing:1px}
    .notice{font-size:26px;line-height:1.65;margin:0 auto 86px;max-width:620px;color:#222}
    .info{width:100%;max-width:590px;margin:0 auto;text-align:left}
    .row{display:grid;grid-template-columns:180px 1fr;align-items:baseline;margin:24px 0;font-size:27px;line-height:1.45}
    .label{color:#8a8a8a}.value{color:#171717;word-break:break-all}.amount{font-weight:500}
    .foot{position:fixed;left:50%;transform:translateX(-50%);bottom:62px;width:calc(100% - 48px);max-width:620px;text-align:center;color:#b5b5b5;font-size:21px;line-height:1.6}

    @media(max-width:700px){
      .generator{padding:14px;margin:14px auto}.panel{padding:18px}.buttons{grid-template-columns:1fr}
      .invoice-view{padding:0 22px 34px}
      .mini-topbar{height:104px}
      .home-btn{left:0;top:24px;width:38px;height:38px}.home-btn svg{width:34px;height:34px}
      .capsule{right:0;top:18px;width:166px;height:60px;border-radius:30px}
      .capsule-left,.capsule-right{width:83px}.dot{width:9px;height:9px}.target{width:30px;height:30px;border-width:4px}.target::after{width:8px;height:8px}
      .content{padding-top:76px}
      .title{font-size:34px;margin-bottom:42px}
      .notice{font-size:22px;margin-bottom:72px;line-height:1.65}
      .row{grid-template-columns:140px 1fr;font-size:22px;margin:22px 0}
      .foot{font-size:17px;bottom:42px;width:calc(100% - 44px)}
    }
    @media(max-width:420px){
      .invoice-view{padding-left:18px;padding-right:18px}
      .mini-topbar{height:100px}
      .home-btn{top:23px}.home-btn svg{width:32px;height:32px}
      .capsule{top:17px;width:150px;height:56px;border-radius:28px}.capsule-left,.capsule-right{width:75px}.dot{width:8px;height:8px}.target{width:28px;height:28px;border-width:3.5px}.target::after{width:8px;height:8px}
      .content{padding-top:70px}.title{font-size:31px}.notice{font-size:20px}.row{grid-template-columns:125px 1fr;font-size:20px}.foot{font-size:16px;width:calc(100% - 36px)}
    }
  </style>
</head>
<body>
  <section class="generator" id="generator">
    <div class="panel">
      <h1>发票信息链接生成器</h1>
      <div class="desc">填写发票号码、合计金额和开票日期，生成一个可分享的网址和二维码。打开链接后会显示为简洁的“发票信息”页面。</div>

      <div class="field"><label for="invoiceNo">发票号码</label><input id="invoiceNo" placeholder="例如：26432000001833663121"></div>
      <div class="field"><label for="amount">合计金额（含税）</label><input id="amount" placeholder="例如：240042.60"></div>
      <div class="field"><label for="date">开票日期</label><input id="date" placeholder="例如：2026.08.05"></div>

      <div class="buttons">
        <button class="btn primary" id="generateBtn">生成链接 + 二维码</button>
        <button class="btn secondary" id="clearBtn">清空</button>
      </div>

      <div class="result" id="result">
        <div class="url" id="shareUrl"></div>
        <div class="buttons">
          <button class="btn primary" id="copyBtn">复制链接</button>
          <button class="btn secondary" id="previewBtn">打开预览</button>
        </div>
        <div class="qr"><div id="qrcode"></div></div>
        <button class="btn primary" id="downloadBtn" style="width:100%;margin-top:12px">下载二维码 PNG</button>
      </div>
    </div>
  </section>

  <section class="invoice-view" id="invoiceView">
    <div class="mini-topbar">
      <a class="home-btn" href="./" aria-label="返回首页">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <path d="M7.8 29.8 29.5 8.9a3.7 3.7 0 0 1 5 0l21.7 20.9a3.5 3.5 0 0 1-2.4 6H50v19.1a3.1 3.1 0 0 1-3.1 3.1H37V43.8H27V58h-9.9a3.1 3.1 0 0 1-3.1-3.1V35.8h-3.8a3.5 3.5 0 0 1-2.4-6Z"/>
        </svg>
      </a>
      <div class="capsule" aria-label="更多操作">
        <div class="capsule-left"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
        <div class="capsule-right"><span class="target"></span></div>
      </div>
    </div>

    <div class="content">
      <h1 class="title">发票信息</h1>
      <div class="notice">以下信息仅为发票二维码所含信息，并不<br>代表查验发票真伪的结果。</div>
      <div class="info">
        <div class="row"><div class="label">发票号码</div><div class="value" id="vNo"></div></div>
        <div class="row"><div class="label">合计金额</div><div class="value amount" id="vAmount"></div></div>
        <div class="row"><div class="label">开票日期</div><div class="value" id="vDate"></div></div>
      </div>
    </div>
    <div class="foot">如需查验发票真伪，请通过税务机关提供的官方渠道进行查验。</div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script>
    const $=id=>document.getElementById(id);
    function formatAmount(v){
      v=(v||'').trim();
      if(!v) return '';
      v=v.replace(/^¥/,'').replace(/,/g,'');
      const n=Number(v);
      if(Number.isFinite(n)) return '¥'+n.toFixed(2)+'(含税)';
      return '¥'+v+'(含税)';
    }
    function buildUrl(){
      const no=$('invoiceNo').value.trim();
      const amount=$('amount').value.trim();
      const date=$('date').value.trim();
      if(!no||!amount||!date){alert('请填写发票号码、合计金额和开票日期。');return null;}
      const u=new URL(location.href);u.search='';u.hash='';
      u.searchParams.set('view','invoice');
      u.searchParams.set('no',no);
      u.searchParams.set('amount',amount);
      u.searchParams.set('date',date);
      return u.toString();
    }
    function generate(){
      const u=buildUrl();if(!u)return;
      $('shareUrl').textContent=u;
      $('qrcode').innerHTML='';
      new QRCode($('qrcode'),{text:u,width:260,height:260,colorDark:'#000000',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});
      $('result').style.display='block';
      $('result').scrollIntoView({behavior:'smooth',block:'start'});
    }
    $('generateBtn').onclick=generate;
    $('clearBtn').onclick=()=>{$('invoiceNo').value='';$('amount').value='';$('date').value='';$('result').style.display='none';$('qrcode').innerHTML=''};
    $('previewBtn').onclick=()=>{const u=buildUrl();if(u)window.open(u,'_blank')};
    $('copyBtn').onclick=async()=>{const u=$('shareUrl').textContent;if(!u)return;try{await navigator.clipboard.writeText(u);alert('链接已复制。')}catch(e){prompt('请复制下面的链接：',u)}};
    $('downloadBtn').onclick=()=>{const c=$('qrcode').querySelector('canvas');const i=$('qrcode').querySelector('img');const src=c?c.toDataURL('image/png'):(i?i.src:'');if(!src){alert('请先生成二维码。');return;}const a=document.createElement('a');a.href=src;a.download='发票信息二维码.png';document.body.appendChild(a);a.click();a.remove()};

    function renderInvoice(){
      const p=new URLSearchParams(location.search);
      if(p.get('view')!=='invoice')return;
      const no=p.get('no')||'';const amount=p.get('amount')||'';const date=p.get('date')||'';
      $('generator').style.display='none';$('invoiceView').style.display='block';
      $('vNo').textContent=no;
      $('vAmount').textContent=formatAmount(amount);
      $('vDate').textContent=date;
      document.title='发票信息';
    }
    renderInvoice();
  </script>
</body>
</html>
